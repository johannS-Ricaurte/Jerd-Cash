<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Microcrédito</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-5xl mx-auto p-6">

        <!-- ENCABEZADO -->
        <div class="mb-6 flex items-start justify-between">

            <div>
                <h1 class="text-3xl font-bold text-blue-900">
                    Simulador de Microcrédito
                </h1>

                <p class="text-gray-600 mt-2">
                    Simula las condiciones de tu crédito según tu perfil.
                </p>
            </div>

            <a
                href="{% url 'cliente_dashboard' %}"
                class="text-sm text-blue-600 hover:text-blue-800"
            >
                Volver al inicio
            </a>

        </div>


        <!-- FORMULARIO -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">

            <h2 class="text-xl font-bold text-gray-800 mb-5">
                Datos del crédito
            </h2>

            <form id="simulador-form">

                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">

                    <!-- MONTO -->
                    <div>

                        <label
                            for="monto_display"
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Monto a solicitar (COP)
                        </label>


                        <!-- CAMPO VISIBLE -->
                        <input
                            type="text"
                            id="monto_display"
                            value="500000"
                            inputmode="numeric"
                            autocomplete="off"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="$0"
                            hx-post="/prestamos/calcular-simulacion/"
                            hx-trigger="input changed delay:500ms"
                            hx-target="#resultado-simulacion"
                            hx-include="#monto, #plazo, [name=csrfmiddlewaretoken]"
                        >


                        <!-- VALOR REAL QUE RECIBE DJANGO -->
                        <input
                            type="hidden"
                            name="monto"
                            id="monto"
                            value="500000"
                        >


                        <p class="text-xs text-gray-500 mt-2">
                            Monto mínimo: $100.000
                        </p>

                    </div>

                    <!-- PLAZO -->
                    <div>

                        <label
                            for="plazo"
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Plazo (meses)
                        </label>

                        <select
                            name="plazo"
                            id="plazo"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                                   focus:outline-none focus:ring-2 focus:ring-blue-500"
                            hx-post="/prestamos/calcular-simulacion/"
                            hx-trigger="change"
                            hx-target="#resultado-simulacion"
                            hx-include="#monto, [name=csrfmiddlewaretoken]"
                        >

                            <option value="3">
                                3 meses
                            </option>

                            <option value="6">
                                6 meses
                            </option>

                            <option value="12" selected>
                                12 meses
                            </option>

                            <option value="24">
                                24 meses
                            </option>

                            <option value="36">
                                36 meses
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BOTÓN -->
                <button
                    type="button"
                    class="w-full bg-blue-800 text-white font-semibold
                           py-3 px-4 rounded-lg
                           hover:bg-blue-900 transition"
                    hx-post="/prestamos/calcular-simulacion/"
                    hx-include="#monto, #plazo, [name=csrfmiddlewaretoken]"
                    hx-target="#resultado-simulacion"
                >
                    Calcular Simulación
                </button>

            </form>

        </div>


        <!-- RESULTADO -->
        <div id="resultado-simulacion">

            <div class="bg-white rounded-xl shadow-sm p-6 text-center text-gray-500">
                Ingresa los datos del crédito y presiona
                <strong>Calcular Simulación</strong>.
            </div>

        </div>

    </div>

    <script>

        function formatearPesos(valor) {

            if (!valor) {
                return '';
            }

            let limpio = valor
                .toString()
                .replace(/[^\d]/g, '');

            if (!limpio) {
                return '';
            }

            limpio = limpio.replace(
                /\B(?=(\d{3})+(?!\d))/g,
                '.'
            );

            return '$' + limpio;
        }


        function obtenerMontoNumerico(valor) {

            if (!valor) {
                return '';
            }

            return valor
                .replace(/[^\d]/g, '');
        }


        const montoDisplay = document.getElementById(
            'monto_display'
        );

        const monto = document.getElementById(
            'monto'
        );


        if (montoDisplay && monto) {

            // Formatear valor inicial
            if (monto.value) {

                montoDisplay.value = formatearPesos(
                    monto.value
                );

            }


            // Mientras escribe
            montoDisplay.addEventListener(
                'input',
                function() {

                    const valor = obtenerMontoNumerico(
                        this.value
                    );

                    monto.value = valor;

                }
            );


            // Al salir del campo
            montoDisplay.addEventListener(
                'blur',
                function() {

                    const valor = obtenerMontoNumerico(
                        this.value
                    );

                    monto.value = valor;

                    this.value = formatearPesos(
                        valor
                    );

                }
            );

        }

    </script>

</body>
</html>
