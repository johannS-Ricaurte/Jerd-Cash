<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Completar registro - JERD-Cash</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center">


    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">

        <h1 class="text-2xl font-bold text-center text-blue-800 mb-2">
            JERD-Cash
        </h1>

        <h2 class="text-xl font-semibold text-center mb-6">
            Completa tu registro
        </h2>


        {% if messages %}

            {% for message in messages %}

                <div class="mb-4 p-3 rounded bg-red-100 text-red-700">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">

            <p class="text-sm text-blue-800">

                Hemos obtenido de Google:

            </p>

            <p class="font-semibold text-gray-900 mt-2">

                {{ datos_google.first_name }}
                {{ datos_google.family_name }}

            </p>

            <p class="text-sm text-gray-600">

                {{ datos_google.email }}

            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="mb-5">

                <label
                    class="block text-sm font-medium text-gray-700 mb-1"
                    for="cedula"
                >
                    Cédula / NIT
                </label>

                <input
                    type="text"
                    name="cedula"
                    id="cedula"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

            </div>


            <div class="flex items-start mb-6">

                <input
                    id="acepta_terminos"
                    name="acepta_terminos"
                    type="checkbox"
                    required
                    class="h-4 w-4 mt-1 text-blue-600
                           border-gray-300 rounded"
                >

                <label
                    for="acepta_terminos"
                    class="ml-3 text-sm text-gray-700"
                >

                    He leído y acepto los

                    <a
                        href="{% url 'terminos' %}"
                        target="_blank"
                        class="text-blue-600 underline"
                    >
                        Términos y Condiciones
                    </a>

                    y la Política de Tratamiento de Datos.

                </label>

            </div>


            <button
                type="submit"
                class="w-full bg-blue-800 text-white py-2 px-4
                       rounded-md hover:bg-blue-900 transition"
            >
                Completar registro
            </button>

        </form>

    </div>

</body>

</html>
