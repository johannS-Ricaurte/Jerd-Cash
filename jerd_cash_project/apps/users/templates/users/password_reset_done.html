
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud procesada - JERD-Cash</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 text-center">
        <div class="text-4xl mb-4">📩</div>

        <h1 class="text-3xl font-bold text-blue-700">JERD-Cash</h1>

        <h2 class="text-xl font-semibold text-gray-800 mt-5">
            Revisa tu correo electrónico
        </h2>

        <p class="text-gray-600 text-sm mt-3">
            Si existe una cuenta asociada al correo ingresado y cumple
            las condiciones para recuperar la contraseña, recibirás
            un mensaje con las instrucciones.
        </p>

        <p class="text-gray-500 text-sm mt-3">
            Si no lo encuentras, revisa la carpeta de correo no deseado.
        </p>

        <a
            href="{% url 'login' %}"
            class="inline-block w-full mt-6 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition"
        >
            Volver al inicio de sesión
        </a>
    </div>

</body>
</html>
